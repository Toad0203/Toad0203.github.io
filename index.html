const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.title = PROFILE.name + " – " + PROFILE.role;

$("skillList").innerHTML = PROFILE.skills.map(s => "<span>" + esc(s) + "</span>").join("");
$("grid").innerHTML = PROJECTS.map(p => {
  const thumb = p.image ? '<img src="' + esc(p.image) + '" alt="' + esc(p.title) + ' screenshot">' : esc(p.initials || p.title.slice(0,2));
  const links = (p.demo ? '<a href="' + esc(p.demo) + '" target="_blank" rel="noopener">Live demo ↗</a>' : "") +

}).join("");
